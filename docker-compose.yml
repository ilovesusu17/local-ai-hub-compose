services:
  # -------------------------------------------------------------
  # 1. 统一网关：New-API
  # 默认外部端口：3000，容器内端口：3000
  # 功能：负责模型路由、多渠道分发、额度计费与 Token 鉴权
  # -------------------------------------------------------------
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: unless-stopped
    ports:
      - "${NEW_API_PORT:-3000}:3000"
    environment:
      - SQL_DSN=${SQL_DSN:-}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:-}
      - SESSION_SECRET=${NEW_API_SESSION_SECRET:-changeme_random_secret_string}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/new-api:/data
    healthcheck:
      # 探测 New-API 状态接口；镜像内自带 wget（已实测），无需额外安装
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ai-hub-net

  # -------------------------------------------------------------
  # 2. 反代服务：WorkBuddy Hub
  # 默认外部端口：8788，容器内端口：8788
  # 功能：多账号反向代理与号池管理，支持国内/国际双区多账号轮询
  # -------------------------------------------------------------
  workbuddy:
    image: ${WORKBUDDY_IMAGE:-ghcr.io/local-hub/workbuddy2api-hub:latest}
    container_name: workbuddy
    restart: unless-stopped
    ports:
      - "${WORKBUDDY_PORT:-8788}:8788"
    environment:
      - PORT=8788
      - APP_KEY=${WORKBUDDY_APP_KEY:-admin_secret_key}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/workbuddy:/app/data
    healthcheck:
      # 占位探测：只要端口有 HTTP 应答即视为存活（wget 退出码 8 表示收到 401/404 等响应，同样算通过）
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8788/ || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-hub-net

  # -------------------------------------------------------------
  # 3. 反代服务：Trae Hub
  # 默认外部端口：8791，容器内端口：8791
  # 功能：Trae 协议反向代理网关服务
  # -------------------------------------------------------------
  trae:
    image: ${TRAE_IMAGE:-ghcr.io/local-hub/trae2api:latest}
    container_name: trae
    restart: unless-stopped
    ports:
      - "${TRAE_PORT:-8791}:8791"
    environment:
      - PORT=8791
      - AUTH_TOKEN=${TRAE_AUTH_TOKEN:-trae_token_secret}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/trae:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8791/ || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-hub-net

  # -------------------------------------------------------------
  # 4. 反代服务：Qoder Hub
  # 默认外部端口：8790，容器内端口：8790
  # 功能：Qoder 协议反向代理网关服务
  # -------------------------------------------------------------
  qoder:
    image: ${QODER_IMAGE:-ghcr.io/local-hub/qoder2api:latest}
    container_name: qoder
    restart: unless-stopped
    ports:
      - "${QODER_PORT:-8790}:8790"
    environment:
      - PORT=8790
      - API_SECRET=${QODER_API_SECRET:-qoder_token_secret}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/qoder:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8790/ || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-hub-net

  # -------------------------------------------------------------
  # 5. CLIProxy 本地代理
  # 默认外部端口：8317，容器内端口：8317
  # 功能：本地 CLI 代理服务与转接口
  # -------------------------------------------------------------
  cliproxyapi:
    image: ${CLIPROXY_IMAGE:-ghcr.io/local-hub/cliproxyapi:latest}
    container_name: cliproxyapi
    restart: unless-stopped
    ports:
      - "${CLIPROXY_PORT:-8317}:8317"
    environment:
      - PORT=8317
      - SECRET_KEY=${CLIPROXY_SECRET:-cliproxy_secret}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/cliproxy:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8317/ || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-hub-net

# -------------------------------------------------------------
# 统一自定义 Docker 桥接网络
# 供容器间直接使用容器名称互相解析通信
# -------------------------------------------------------------
networks:
  ai-hub-net:
    name: ai-hub-net
    driver: bridge
